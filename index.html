<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure login interface">
  <title>Sign In | Login System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <header class="card-header">
        <div>
          <p class="eyebrow">WELCOME BACK</p>
          <h1 id="login-title">Login System</h1>
        </div>

      </header>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
          <p class="field-error" id="email-error" role="alert"></p>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" id="forgot-password">Forgot password?</a>
          </div>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="8">
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-error" id="password-error" role="alert"></p>

          <div class="strength" aria-label="Password strength">
            <div class="strength-bars" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
            <span id="strength-label">Password strength</span>
          </div>
        </div>

        <label class="remember">
          <input id="remember" name="remember" type="checkbox">
          <span>Remember me</span>
        </label>

        <p class="form-message" id="form-message" role="status"></p>

        <div class="form-actions">
          <span id="submit-status">Not submitted</span>
          <button class="submit-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
            Sign in
          </button>
        </div>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
